# Configuration commune a l'equipe : memes commandes sur tous les postes.
[defaults]
# Inventaire dynamique EC2 : decouvre les instances au moment de l'execution.
inventory           = inventory/aws_ec2.yml
remote_user         = ubuntu
private_key_file    = ~/.ssh/id_ed25519
roles_path          = roles
# Mot de passe du coffre local a chaque poste, jamais versionne.
vault_password_file = .vault_pass
interpreter_python  = /usr/bin/python3
# Cles d'hote verifiees ; les nouvelles instances de l'ASG sont acceptees via
# StrictHostKeyChecking=accept-new (ssh_config genere), une cle modifiee est refusee.
host_key_checking   = True
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Rebond par le bastion de l'environnement cible (genere par run_playbook.sh).
ssh_args   = -F generated/ssh_config -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
